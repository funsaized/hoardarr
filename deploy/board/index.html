<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#141023">
    <title>Night Shift · Hoardarr</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/board.css">
    <script type="module" src="/board.js"></script>
  </head>
  <body>
    <canvas id="mesh" aria-hidden="true"></canvas>
    <header><a href="?" aria-label="Hoardarr home"><span class="vault-mark" aria-hidden="true"><i></i></span>Hoardarr</a><div id="health" role="status">Connecting…</div></header>
    <main>
      <div class="horizon">
        <h1>Night <em>Shift</em></h1>
        <div class="stars"></div>
        <div class="sun"></div>
        <div class="ridge"></div>
        <div class="road"></div>
      </div>
      <nav id="views" aria-label="Main navigation"></nav>
      <div id="workspace">
        <div id="listing">
          <div id="tools"></div>
          <div id="results"></div>
        </div>
        <aside id="inspector" tabindex="-1" aria-label="Inspector"></aside>
      </div>
      <footer><span id="torlink">Downloader · connecting</span><span id="catalog">Catalog · connecting</span></footer>
    </main>
    <div id="action-hint" class="action-hint" aria-hidden="true" hidden></div>
    <dialog id="review-dialog" aria-labelledby="decision-title" aria-describedby="decision-effect">
      <p class="kicker" id="decision-item"></p>
      <h2 id="decision-title"></h2>
      <p id="decision-effect"></p>
      <form method="dialog" class="dialog-actions">
        <button class="small" autofocus>Cancel</button>
        <button class="primary" type="button" id="apply-decision"></button>
      </form>
    </dialog>
    <div class="sr" id="announce" role="status"></div>
  </body>
</html>
