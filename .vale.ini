StylesPath = .vale/styles
Vocab = Hoardarr
MinAlertLevel = suggestion

# Opt in to reader-facing Markdown only, including in editor integrations.
[*]
BasedOnStyles = NONE

[{README.md,CONTRIBUTING.md,SECURITY.md,docs/*.md,docs/**/*.md,examples/*.md,examples/**/*.md}]
BasedOnStyles = Vale, Google, Hoardarr
# All prose feedback is advisory in v1. Tool/configuration failures still fail.
Vale = warning
Google = warning
Hoardarr = warning
Google.Passive = suggestion

# Calibrated against README, first-run, configuration, and networking.
# Keep technical terminology, compact tables, and established punctuation.
Google.Acronyms = NO
Google.Anthropomorphism = NO
Google.Contractions = NO
Google.FirstPerson = NO
Google.Headings = NO
Google.OxfordComma = NO
Google.Parens = NO
Google.Semicolons = NO
Google.WordList = NO
Google.WordListCase = NO

# Opt in by rule, never enable the entire upstream AI style.
ai-tells.FillerPhrases = suggestion
ai-tells.PromotionalPuffery = suggestion
ai-tells.OpeningCliches = suggestion
ai-tells.StructureAnnouncements = suggestion
ai-tells.ContrastiveFormulas = suggestion
ai-tells.VagueAttributions = suggestion

# Operational instructions and generated/historical material have no prose profile.
[{**/AGENTS.md,**/SKILL.md,docs/generated/**,docs/archive/**,docs/evidence/**,docs/benchmarks/**,docs/qualification/results/**,examples/fixtures/**,examples/outputs/**}]
BasedOnStyles = NONE

# Source comments and structured examples are outside v1.
[*.{ts,js,json,yaml,yml,py,sh}]
BasedOnStyles = NONE
