type: '@swamp/ssh'
typeVersion: 2026.07.28.1
id: f0b51147-3032-4ab1-a9b1-593f726ada58
name: mac
version: 1
tags: {}
globalArguments:
  name: hoardarr-mac
  transport:
    kind: ssh
    user: media
    port: 22
    auth:
      kind: key
    identityFile: /home/media/.ssh/id_ed25519
    identitiesOnly: true
    knownHostsFile: /home/media/.ssh/known_hosts
    strictHostKeyChecking: 'yes'
    connectTimeoutSec: 10
    extraOptions: []
    controlMaster:
      enabled: true
      persistSec: 600
  hosts:
    - name: mini
      address: mini
      tags:
        - mac
        - media
      attrs:
        tailscaleDns: library.example.invalid
        tailscaleIp: 192.0.2.10
methods: {}
