name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Vale and styles
        run: python3 tools/docs_lint.py setup
      - name: Verify documentation lint tooling
        run: python3 -m unittest discover -s tests -p 'docs_lint_test.py'
      - name: Scan reader-facing prose (advisory)
        run: python3 tools/docs_lint.py all --output line
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.8
      - run: deno task check
      - run: deno task test
      - run: deno fmt --check extensions src cli tests docs README.md
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: python3 tests/docs_links.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: hoardarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm hoardarr:ci help
      - run: docker run --rm hoardarr:ci init --profile compose-vpn-local --dir /tmp/installer-check
      - run: docker run --rm --entrypoint deno hoardarr:ci task check
      - run: docker compose -f deploy/compose/compose.yaml config --quiet
      - run: tests/network_isolation.sh
