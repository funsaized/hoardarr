name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - run: deno task check
      - run: deno task test
      - run: deno fmt --check extensions src cli tests
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hoardarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm hoardarr:ci help
      - run: docker run --rm hoardarr:ci init --profile compose-vpn-local --dir /tmp/installer-check
      - run: docker run --rm --entrypoint deno hoardarr:ci task test
      - run: docker compose -f deploy/compose/compose.yaml config --quiet
      - run: tests/network_isolation.sh
