name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.8
      - run: deno task check && deno task test
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: hoardarr:release
          labels: org.opencontainers.image.source=https://github.com/funsaized/hoardarr
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm --entrypoint deno hoardarr:release task check
      - run: docker run --rm hoardarr:release init --profile compose-vpn-local --dir /tmp/install-check
      - run: tests/network_isolation.sh
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image and source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY}:$version"
          docker tag hoardarr:release "$image"
          docker push "$image"
          mkdir release
          git archive --format=tar.gz --prefix="hoardarr-$version/" HEAD -o "release/hoardarr-$version.tar.gz"
          cd release
          sha256sum "hoardarr-$version.tar.gz" > SHA256SUMS
          printf 'Hoardarr: recoverable media workflows, VPN container profile, and native DevVM source kit.\n\nContainer: `%s`\n\nSee the README and migration guide before upgrading. Scheduling starts disabled.\n' "$image" > notes.md
          gh release create "$GITHUB_REF_NAME" "hoardarr-$version.tar.gz" SHA256SUMS --title "Hoardarr $version" --notes-file notes.md
